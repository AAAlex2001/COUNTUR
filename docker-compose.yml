services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: countur-backend
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      media-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      WEB_WORKERS: ${WEB_WORKERS:-3}
      CORS_ORIGINS: '["${SITE_URL}"]'
      MEDIA_DIR: /app/media
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SHOP_TIMEZONE: ${SHOP_TIMEZONE:-Europe/Moscow}
      SITE_URL: ${SITE_URL:-https://24countur.ru}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_DAYS: ${JWT_EXPIRES_DAYS:-7}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CDEK_ACCOUNT: ${CDEK_ACCOUNT:-}
      CDEK_PASSWORD: ${CDEK_PASSWORD:-}
      CDEK_ORIGIN_CITY_CODE: ${CDEK_ORIGIN_CITY_CODE:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - media:/app/media

  media-init:
    image: countur-backend
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/media"]
    restart: "no"
    volumes:
      - media:/app/media

  support-bot:
    build: ./support-bot
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_INTERNAL_URL: http://backend:8000/api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./nginx/${NGINX_CONF:-http.conf}:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/locations.inc:/etc/nginx/locations.inc:ro
      - media:/srv/media:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    profiles: ["certs"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  postgres_data:
  media:
  certbot_www:
  certbot_conf:
