name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Проверка бэкенда
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-0123456789
      ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.8.6
      - run: python -m ruff check app tests migrations
      - run: python -m pytest -q

  support-bot:
    name: Проверка бота поддержки
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: countur_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/countur_test
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/countur_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-0123456789
      ADMIN_PASSWORD: ci-only-password
    defaults:
      run:
        working-directory: support-bot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            support-bot/requirements.txt
      - run: pip install -r ../backend/requirements.txt -r requirements.txt ruff==0.8.6
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m ruff check app scripts tests
      - run: python -m pytest -q
      - run: docker build -t countur-support-bot:test .
      - run: docker run --rm countur-support-bot:test python -c "from app.main import main"

  frontend:
    name: Проверка фронтенда
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src

  deploy:
    name: Деплой на сервер
    needs: [backend, frontend, support-bot]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            git -C /root fetch origin main
            git -C /root checkout main
            git -C /root merge --ff-only origin/main
            docker compose up -d --build --remove-orphans
